[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-influx-sync"
version = "0.1.1"
description = "Sync Garmin Connect Personal API metrics into InfluxDB 2.x"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garmin-connect-personal-api-python==1.0.0",
    "influxdb-client==1.50.0",
    "tzdata==2026.5",
]

[project.scripts]
garmin-influx-sync = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "config", "util", "version"]

[tool.setuptools.packages.find]
where = ["src"]
